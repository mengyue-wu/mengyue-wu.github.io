:root {

  --primary-dark: #1d4ed8;

  --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.04);

* { box-sizing: border-box; }

/* Sticky Glass Navbar */
.topbar {
  position: sticky;

}
